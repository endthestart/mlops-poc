apiVersion: v1
kind: Pod
metadata:
  name: test-smb-pod
  namespace: default
spec:
  containers:
  - name: test
    image: busybox
    command: ["sh", "-c", "echo 'SMB storage works!' > /data/test.txt && cat /data/test.txt && sleep 3600"]
    volumeMounts:
    - name: smb-volume
      mountPath: /data
  volumes:
    - name: smb-volume
      persistentVolumeClaim:
        claimName: test-smb-pvc
